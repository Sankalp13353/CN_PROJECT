# =============================================================================
# nginx — Reverse Proxy, Load Balancer & TLS Termination
# Private Network Service Platform — Team 1
# =============================================================================
#
# Machine:      Mac 2
# IP Address:   10.7.14.9
#
# Purpose:
#   - Single edge entry point for client traffic
#   - Terminates TLS (HTTPS) on port 443
#   - Reverse-proxies requests to Backend A and Backend B
#   - Round-robin load balances between both backends
#   - Preserves backend response headers
#   - Provides HTTP caching headers
#
# =============================================================================


# -----------------------------------------------------------------------------
# Global Settings
# -----------------------------------------------------------------------------

worker_processes 1;

events {
    worker_connections 128;
}

http {

    # MIME type definitions
    include mime.types;

    default_type application/octet-stream;

    # Efficient file serving
    sendfile on;

    # Keep-alive connection timeout
    keepalive_timeout 65;


    # =========================================================================
    # Upstream — Round-Robin Load Balancing
    # =========================================================================
    #
    # Both backend servers are running on Mac 2.
    #
    # Backend A → Port 3001
    # Backend B → Port 3002
    #
    # nginx uses round-robin load balancing by default.
    #
    # Request 1 → Backend A
    # Request 2 → Backend B
    # Request 3 → Backend A
    # Request 4 → Backend B
    #
    # =========================================================================

    upstream team1_backends {

        server 127.0.0.1:3001;    # Backend A

        server 127.0.0.1:3002;    # Backend B

    }


    # =========================================================================
    # HTTP Server — Redirect HTTP to HTTPS
    # =========================================================================
    #
    # Client requests:
    #
    #   http://app.team1.test
    #   http://api.team1.test
    #
    # are redirected to HTTPS.
    #
    # =========================================================================

    server {

        listen 80;

        server_name app.team1.test api.team1.test;

        return 301 https://$host$request_uri;

    }


    # =========================================================================
    # HTTPS Server — TLS Termination
    # =========================================================================
    #
    # nginx accepts HTTPS connections on port 443.
    #
    # TLS is terminated at nginx.
    #
    # After TLS termination, nginx forwards the request to one of the
    # backend servers using HTTP.
    #
    # =========================================================================

    server {

        listen 443 ssl;

        server_name app.team1.test api.team1.test;


        # ---------------------------------------------------------------------
        # TLS Certificate
        # ---------------------------------------------------------------------

        ssl_certificate
            /opt/homebrew/etc/nginx/certs/team1.crt;

        ssl_certificate_key
            /opt/homebrew/etc/nginx/certs/team1.key;


        # ---------------------------------------------------------------------
        # TLS Protocols
        # ---------------------------------------------------------------------

        ssl_protocols TLSv1.2 TLSv1.3;


        # ---------------------------------------------------------------------
        # Reverse Proxy & Load Balancing
        # ---------------------------------------------------------------------
        #
        # All incoming HTTPS requests are forwarded to the
        # team1_backends upstream group.
        #
        # nginx automatically selects Backend A or Backend B
        # using round-robin.
        #
        # ---------------------------------------------------------------------

        location / {

            proxy_pass http://team1_backends;


            # -----------------------------------------------------------------
            # Forwarding Headers
            # -----------------------------------------------------------------

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;


            # -----------------------------------------------------------------
            # HTTP Caching
            # -----------------------------------------------------------------
            #
            # Responses can be cached by the client for 60 seconds.
            #
            # -----------------------------------------------------------------

            add_header Cache-Control "public, max-age=60";

        }

    }

}