# =============================================================================
# dnsmasq — Private DNS Configuration for the Private Network Service Platform
# =============================================================================
#
# Machine:      Mac 1
# IP Address:   10.7.0.221
# MAC Address:  10:9f:41:b6:11:88
#
# Purpose:
#   Private DNS server for Team 1.
#   Resolves project .test domains to Mac 2, which runs nginx
#   reverse proxy / load balancer and both backend services.
#
# Mac 2:
#   IP Address:  10.7.14.9
#   MAC Address:  10:9f:41:b3:be:81
#
# =============================================================================


# ---------------------------------------------------------------------------
# 1. Listening Configuration
# ---------------------------------------------------------------------------

# Listen on the Wi-Fi interface.
interface=en0

# Bind dnsmasq only to the specified interface.
bind-interfaces

# Standard DNS port.
port=53

# Do not use /etc/hosts entries.
no-hosts

# Do not read system resolver configuration.
no-resolv


# ---------------------------------------------------------------------------
# 2. Project Domain Records
# ---------------------------------------------------------------------------
#
# Both project domains point to Mac 2 (10.7.14.9), where nginx is running.
#
# Client
#   |
#   | DNS query
#   v
# Mac 1 — Private DNS
#   |
#   | app.team1.test -> 10.7.14.9
#   | api.team1.test -> 10.7.14.9
#   v
# Mac 2 — nginx Edge Proxy
#
# ---------------------------------------------------------------------------

address=/app.team1.test/10.7.14.9
address=/api.team1.test/10.7.14.9


# ---------------------------------------------------------------------------
# 3. Upstream DNS Forwarding
# ---------------------------------------------------------------------------
#
# Queries outside the project domains are forwarded to Google's
# public DNS resolver.
#
# This keeps normal internet DNS resolution working.
#
# ---------------------------------------------------------------------------

server=8.8.8.8


# ---------------------------------------------------------------------------
# 4. Cache Configuration
# ---------------------------------------------------------------------------
#
# dnsmasq caches DNS responses to reduce repeated upstream queries.
#
# ---------------------------------------------------------------------------

cache-size=1000


# ---------------------------------------------------------------------------
# 5. Logging
# ---------------------------------------------------------------------------
#
# Enabled during development/testing to help verify DNS queries.
#
# ---------------------------------------------------------------------------

log-queries